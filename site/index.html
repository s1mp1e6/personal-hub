  persistedStateMeta=nextMeta;persistedShadow=cloneState(nextState);state=cloneState(nextState);stateRevision++;persistedRevision=stateRevision;try{localStorage.removeItem(PENDING_JOURNAL_KEY)}catch(error){}renderNav();renderContent();updateStorageInfo();return nextMeta;
}
async function commitIncomingSync(stage){
  const payload=JSON.parse(stage.chunks.join('')),files=await validateIncomingSyncPayload(payload,stage),before=cloneState(state),plan=await SyncCore.buildMergePlan(payload.state,before,payload.scope),selected=new Set(stage.requestedIds||[]),next=await SyncCore.applyMergePlan(plan,before,{selectedOperationIds:selected}),point=RecoveryCore.createRecoveryPoint(before,{id:'sync-'+Date.now()+'-'+uid(),kind:'device-sync',label:'设备同步前'}),beforeCopies=countConflictCopies(before),afterCopies=countConflictCopies(next);await writeSyncTransaction(next,files,point);syncLastRecovery=point;const copies=Math.max(0,afterCopies-beforeCopies);syncLastResult=summarizeSyncResult(plan,selected,copies,0);renderSyncResult(syncLastResult);sendSyncV2({protocol:SYNC_PROTOCOL,type:'commit-result',transferId:stage.transferId,ok:true});
}
function summarizeSyncResult(plan,selected,copies,failures=0){const stats={add:0,update:0,conflictCopy:copies||0,delete:0,skip:0,failure:failures||0};(plan.operations||[]).forEach(op=>{if(op.category==='same')return;const picked=selected.has(String(op.id));if(!picked){stats.skip++;return}if(op.category==='add')stats.add++;else if(op.category==='update')stats.update++;else if(op.category==='pendingDelete')stats.delete++});return stats}
function renderSyncFailureResult(){const selected=new Set([...document.querySelectorAll('[data-sync-operation]:checked')].map(input=>input.value)),stats=syncPreviewPlan?summarizeSyncResult(syncPreviewPlan,selected,0,1):{add:0,update:0,conflictCopy:0,delete:0,skip:0,failure:1};renderSyncResult(stats,{ok:false})}
function renderSyncResult(result,options={}){const ok=options.ok!==false,stats=result||{add:0,update:0,conflictCopy:0,delete:0,skip:0,failure:0},labels=[['新增',stats.add],['更新',stats.update],['冲突副本',stats.conflictCopy],['删除',stats.delete],['跳过',stats.skip],['失败',stats.failure]];document.querySelectorAll('[data-sync-step]').forEach(el=>el.classList.toggle('active',el.dataset.syncStep==='confirm'));const pane=document.getElementById('syncComparePane');pane.style.display='block';pane.innerHTML=`<div class="sync-result"><strong>${ok?'同步完成':'同步未完成'}</strong><div style="margin-top:6px">已创建 ${stats.conflictCopy} 条同步副本</div><div class="sync-summary">${ok?'所有选中内容已作为一个事务写入本机。':'本机数据保持原样，请检查双方选择后重试。'}</div><div class="sync-summary" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px">${labels.map(([label,value])=>`<span data-sync-result="${label}">${label} ${value}</span>`).join('')}</div>${ok?'<button class="btn ghost" onclick="undoLastOperation()">撤销本次同步</button>':''}</div>`;syncStatus(ok?'同步完成':'同步未完成')}
async function undoLastOperation(){if(!syncLastRecovery)return;try{await writeSyncTransaction(cloneState(syncLastRecovery.state),[],null,syncLastRecovery.id);syncLastRecovery=null;const pane=document.getElementById('syncComparePane');pane.innerHTML='<div class="sync-result"><strong>已撤销本次同步</strong><div class="sync-summary">本机数据已恢复到同步前。</div></div>';syncStatus('已撤销本次同步')}catch(error){syncStatus('撤销失败：'+error.message)}}
function abortSelectiveSync(reason){syncIncoming=null;if(reason&&reason.indexOf('失败')>=0)renderSyncFailureResult();if(syncDc&&syncDc.readyState==='open')sendSyncV2({protocol:SYNC_PROTOCOL,type:'abort',reason:reason||'同步已取消'});syncStatus(reason||'同步已取消')}
async function syncSendBackup(){
  if(!syncDc||syncDc.readyState!=='open'){toast('设备还未连接');return}
  try{
    const text=await buildBackupText();const id=uid();const chunkSize=16000;const total=Math.ceil(text.length/chunkSize);syncStatus(`正在发送备份：0/${total}`);sendSyncJson({type:'backup-start',id,total,size:text.length});for(let i=0;i<total;i++){while(syncDc.bufferedAmount>512000)await new Promise(r=>setTimeout(r,50));sendSyncJson({type:'backup-chunk',id,index:i,chunk:text.slice(i*chunkSize,(i+1)*chunkSize)});syncStatus(`正在发送备份：${i+1}/${total}`)}sendSyncJson({type:'backup-end',id});toast('备份已发送');syncStatus('备份已发送')
  }catch(error){console.warn('同步发送失败:',error);syncStatus('发送失败：本机数据未保存');toast('同步发送失败，本机数据尚未安全保存，请重试。')}
}
async function receiveSyncMessage(raw){try{const msg=JSON.parse(raw);if(msg.protocol===SYNC_PROTOCOL){const limits=syncLimits(msg.type==='data-chunk'&&syncIncoming?{seenChunkIndexes:syncIncoming.seen}:{});SyncCore.validateEnvelope(msg,limits);syncProtocolTrace.push(msg.type);if(msg.type==='scope-offer'){syncPeerScope=normalizeSyncScopeValue(msg.scope);sendSyncV2({protocol:SYNC_PROTOCOL,type:'manifest-request',scope:syncPeerScope});return}if(msg.type==='manifest-request'){if(!syncOfferedScope||!syncScopeContains(syncOfferedScope,msg.scope))throw new Error('对方请求超出已选择范围');const manifest=await SyncCore.buildManifest(state,msg.scope);freezeSyncManifestAuthorization(manifest);sendSyncV2({protocol:SYNC_PROTOCOL,type:'manifest',manifest});return}if(msg.type==='manifest'){await receiveSyncManifest(msg.manifest);return}if(msg.type==='plan-selection'){await sendSelectedRecords(msg.operationIds);return}if(msg.type==='data-start'){const requested=syncIncoming&&syncIncoming.requestedIds||[];syncIncoming={protocol:2,transferId:msg.transferId,total:msg.totalChunks,totalBytes:msg.totalBytes,modules:msg.modules,attachmentCount:msg.attachmentCount,attachmentBytes:msg.attachmentBytes,chunks:Array(msg.totalChunks),received:0,seen:new Set(),requestedIds:requested};return}if(msg.type==='data-chunk'){if(!syncIncoming||!syncIncoming.transferId)throw new Error('未开始数据传输');if(syncIncoming.chunks[msg.chunk.index]==null){syncIncoming.chunks[msg.chunk.index]=msg.chunk.payload;syncIncoming.received++}const bar=document.getElementById('syncProgressBar');if(bar)bar.style.width=Math.round(syncIncoming.received/syncIncoming.total*90)+'%';return}if(msg.type==='data-end'){if(!syncIncoming||msg.transferId!==syncIncoming.transferId||syncIncoming.received!==syncIncoming.total)throw new Error('同步数据不完整');const stage=syncIncoming,text=stage.chunks.join('');if(new Blob([text]).size!==msg.totalBytes)throw new Error('同步数据大小不匹配');syncIncoming=null;await commitIncomingSync(stage);return}if(msg.type==='commit-result'){if(!msg.ok)renderSyncFailureResult();syncStatus(msg.ok?'对方已完成写入':'对方写入失败');return}if(msg.type==='abort'){syncIncoming=null;renderSyncFailureResult();syncStatus('同步已中止：'+msg.reason);return}}if(msg.type==='backup-start'){syncIncoming={id:msg.id,total:msg.total,chunks:Array(msg.total),received:0};syncStatus(`正在接收备份：0/${msg.total}`);return}if(msg.type==='backup-chunk'&&syncIncoming&&msg.id===syncIncoming.id){if(syncIncoming.chunks[msg.index]==null){syncIncoming.chunks[msg.index]=msg.chunk;syncIncoming.received++}syncStatus(`正在接收备份：${syncIncoming.received}/${syncIncoming.total}`);return}if(msg.type==='backup-end'&&syncIncoming&&msg.id===syncIncoming.id){const text=syncIncoming.chunks.join('');syncIncoming=null;receiveSyncBackup(text)}}catch(e){console.warn('接收同步消息失败:',e);syncIncoming=null;renderSyncFailureResult();syncStatus('接收消息失败：'+e.message);if(syncDc&&syncDc.readyState==='open')try{sendSyncV2({protocol:SYNC_PROTOCOL,type:'abort',reason:'校验失败'})}catch(error){}}}
async function receiveSyncBackup(text){try{const parsed=JSON.parse(text);const data=parsed&&parsed.data&&parsed.data.modules?parsed.data:null;if(!data){toast('收到的数据格式不正确');return}if(confirm(`收到另一台设备的备份。\\n导出时间：${new Date(parsed.exportedAt).toLocaleString()}\\n条目数量：${countBackupItems(data)}\\n附件数量：${(parsed.files||[]).length}\\n\\n是否覆盖当前本机数据？`)){await restoreBackupFiles(parsed.files);state=data;state.settings=state.settings||{theme:'default'};applyTheme();save();renderNav();renderContent();toast('已接收并导入备份')}}catch(e){toast('接收失败：'+e.message)}}
async function startQrScan(){
  if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){showCameraDeniedHelp('摄像头扫码需要 HTTPS。请使用 GitHub Pages/Cloudflare Pages 的 https 地址，或复制粘贴配对码。');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showCameraDeniedHelp('当前浏览器不支持摄像头扫码，请复制粘贴配对码');return}
  if(!(state.settings&&state.settings.qrCameraGuideSeen)){showCameraPermissionGuide();return}
  try{
    stopQrScan();
    const box=document.getElementById('qrScanBox');
    box.innerHTML='<div class="qr-scan-stage"><video id="qrVideo" autoplay playsinline muted></video><canvas id="qrCanvas" class="qr-canvas"></canvas><div class="qr-scan-frame"><i></i><i></i><i></i><i></i></div><div class="qr-scan-line"></div></div><div id="qrHint" class="qr-scan-hint">摄像头打开后，请把二维码放在画面中央</div>';
    const video=document.getElementById('qrVideo'),hint=document.getElementById('qrHint');
    box.style.display='block';syncStatus('正在打开摄像头...');
    try{qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
    catch(e){qrStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
    video.srcObject=qrStream;await video.play();syncStatus('请把另一台设备的二维码放入画面');
    setTimeout(()=>{if(qrStream&&(!video.videoWidth||!video.videoHeight)&&hint)hint.textContent='摄像头已授权但暂时没有画面。请检查浏览器权限、系统相机占用，或改用复制粘贴配对码。'},2000);
    scanQrFrame();
  }catch(e){if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}showCameraDeniedHelp('摄像头打开失败：'+(e.message||'请检查权限')+'。也可以复制粘贴配对码。')}
}
function showCameraPermissionGuide(){
  const box=document.getElementById('qrScanBox');
  if(!box)return;
  box.style.display='block';
  box.innerHTML=`<div class="sync-summary">相机画面只用于本机识别二维码，不会上传到服务器。</div><div class="sync-summary">如果浏览器拒绝权限，可以改用相册识别或复制粘贴配对码。</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn primary" type="button" onclick="continueQrCamera()">继续并请求权限</button><button class="btn ghost" type="button" onclick="openQrImagePicker()">从相册识别二维码</button></div><input id="qrImageInput" type="file" accept="image/*" style="display:none">`;
  const input=document.getElementById('qrImageInput');
  if(input)input.onchange=decodeQrImageFile;
  syncStatus('先确认说明，再请求摄像头权限');
}
async function continueQrCamera(){state.settings=state.settings||{};state.settings.qrCameraGuideSeen=true;save();await startQrScan()}
function showCameraDeniedHelp(message){
  const box=document.getElementById('qrScanBox');
  if(box){box.style.display='block';box.innerHTML=`<div class="sync-summary">${esc(message||'摄像头权限被拒绝。')}</div><div class="sync-summary">可以改用相册识别二维码，或直接复制粘贴配对码。</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn primary" type="button" onclick="openQrImagePicker()">从相册识别二维码</button><button class="btn ghost" type="button" onclick="showCameraPermissionGuide()">重新查看说明</button></div><input id="qrImageInput" type="file" accept="image/*" style="display:none">`;const input=document.getElementById('qrImageInput');if(input)input.onchange=decodeQrImageFile}
  syncStatus(message||'摄像头权限被拒绝')
}
function openQrImagePicker(){const input=document.getElementById('qrImageInput');if(input)input.click()}
async function drawQrImageFile(file,canvas){const ctx=canvas.getContext('2d');if(window.createImageBitmap){const bitmap=await createImageBitmap(file);canvas.width=bitmap.width;canvas.height=bitmap.height;ctx.drawImage(bitmap,0,0);if(bitmap.close)bitmap.close();return}const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{canvas.width=img.naturalWidth||img.width;canvas.height=img.naturalHeight||img.height;ctx.drawImage(img,0,0);resolve()};img.onerror=()=>reject(new Error('图片读取失败'));img.src=url})}
async function decodeQrImageFile(event){
  const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;
  const box=document.getElementById('qrScanBox');if(box){box.style.display='block';box.innerHTML='<div class="sync-summary">正在识别相册中的二维码...</div>'}
  try{
    const canvas=document.getElementById('qrCanvas')||document.createElement('canvas');
    await drawQrImageFile(file,canvas);
    const scale=Math.min(1,1024/Math.max(canvas.width,canvas.height));
    if(scale<1){const small=document.createElement('canvas');small.width=Math.max(1,Math.round(canvas.width*scale));small.height=Math.max(1,Math.round(canvas.height*scale));small.getContext('2d').drawImage(canvas,0,0,small.width,small.height);canvas.width=small.width;canvas.height=small.height;canvas.getContext('2d').drawImage(small,0,0)}
    const ctx=canvas.getContext('2d');let text='';
    try{if('BarcodeDetector' in window){if(!qrDetector)qrDetector=new BarcodeDetector({formats:['qr_code']});const codes=await qrDetector.detect(canvas);if(codes&&codes[0])text=codes[0].rawValue}}catch(e){}
    if(!text&&typeof jsQR!=='undefined'){const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height);if(code)text=code.data}
    if(text){document.getElementById('syncRemote').value=text;syncStatus('已从相册识别二维码');toast('已填入对方配对码');return}
    showCameraDeniedHelp('没有识别到二维码，请换一张更清晰的图片。')
  }catch(error){showCameraDeniedHelp('相册识别失败：'+(error.message||'请重试'))}
}
function stopQrScan(){if(qrScanTimer){clearTimeout(qrScanTimer);qrScanTimer=null}if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}const box=document.getElementById('qrScanBox');if(box)box.style.display='none'}
async function scanQrFrame(){
  const video=document.getElementById('qrVideo'),canvas=document.getElementById('qrCanvas');
  if(!video||!canvas||!qrStream)return;
  if(video.readyState>=2){
    const scale=Math.min(1,720/Math.max(video.videoWidth,video.videoHeight));
    canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
    const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,canvas.width,canvas.height);
    let text='';
    try{
      if('BarcodeDetector' in window){if(!qrDetector)qrDetector=new BarcodeDetector({formats:['qr_code']});const codes=await qrDetector.detect(canvas);if(codes&&codes[0])text=codes[0].rawValue}
    }catch(e){}
    if(!text&&typeof jsQR!=='undefined'){const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height);if(code)text=code.data}
    if(text){document.getElementById('syncRemote').value=text;stopQrScan();syncStatus('已识别二维码，配对码已填入');toast('已填入对方配对码');return}
  }
  qrScanTimer=setTimeout(scanQrFrame,250);
}
function updateStorageInfo(){try{const size=new Blob([JSON.stringify(state)]).size;document.getElementById('storageInfo').textContent='本机 '+(size/1024).toFixed(1)+'KB'}catch(e){}}

function init(){renderNav();renderContent();hydrationPromise=hydrateState();updateClock();setInterval(updateClock,1000);updateStorageInfo();}
init();
