<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2383e2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="description" content="本机优先的个人工作台：任务、文献、实验、阅读、日记与近距离设备同步，数据默认保存在当前设备。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232383e2'/%3E%3Cpath d='M32 13l5.2 13.8L51 32l-13.8 5.2L32 51l-5.2-13.8L13 32l13.8-5.2L32 13z' fill='white'/%3E%3C/svg%3E">
<title>我的工作台 · Personal Hub</title>
<style>
  :root{
    --bg:#f5f3ef;--bg2:#efeae3;--sidebar:#fffdf8;--card:#ffffff;
    --ink:#37352f;--ink-soft:#6b6a66;--ink-faint:#6f6d68;
    --line:#ececec;--line-strong:#e0e0e0;
    --accent:#2383e2;--accent-soft:#e8f1fb;
    --green:#0f7b3d;--green-soft:#e8f5ee;
    --orange:#d9730d;--orange-soft:#fbf0e3;
    --red:#e03e3e;--red-soft:#fce8e8;
    --purple:#6940a5;--purple-soft:#f0ecf7;
    --yellow:#cb9a1a;--yellow-soft:#fbf3dd;
    --pink:#ad1a72;--pink-soft:#f7ecf3;
    --teal:#0d7d7d;--teal-soft:#e2f2f2;
    --shadow:0 1px 2px rgba(15,15,15,.04),0 4px 12px rgba(15,15,15,.04);
    --radius:12px;--sidebar-w:250px;
  }
  :root[data-theme="light"]{
    --bg:#f7f8fb;--bg2:#eef2f7;--sidebar:#ffffff;--card:#ffffff;
    --ink:#23272f;--ink-soft:#5d6472;--ink-faint:#667085;
    --line:#e7ebf0;--line-strong:#d8dee8;
    --accent:#2563eb;--accent-soft:#e8efff;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 22px rgba(15,23,42,.06);
  }
  :root[data-theme="dark"]{
    --bg:#171717;--bg2:#22211f;--sidebar:#1f1f1d;--card:#242424;
    --ink:#f1eee8;--ink-soft:#c5c0b8;--ink-faint:#a39c94;
    --line:#33322f;--line-strong:#46433e;
    --accent:#6aa8ff;--accent-soft:#1f3248;
    --green:#66d58a;--green-soft:#1c3524;
    --orange:#ffb15f;--orange-soft:#3d2b1d;
    --red:#ff7a7a;--red-soft:#3c2020;
    --purple:#c9a9ff;--purple-soft:#302742;
    --yellow:#f4d36a;--yellow-soft:#39321f;
    --pink:#ff92cc;--pink-soft:#3a2432;
    --teal:#70d6d6;--teal-soft:#1d3434;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.28);
  }
  :root[data-theme="forest"]{
    --bg:#f2f6f1;--bg2:#e7efe4;--sidebar:#fbfdf8;--card:#ffffff;
    --ink:#273126;--ink-soft:#657060;--ink-faint:#687260;
    --line:#e1e8dc;--line-strong:#cfd9c7;
    --accent:#2f7d55;--accent-soft:#e2f2e9;
    --green:#16734a;--green-soft:#e2f2e9;
    --orange:#ba6a22;--orange-soft:#faecd9;
    --purple:#6f579b;--purple-soft:#efeafa;
    --shadow:0 1px 2px rgba(28,48,30,.04),0 8px 22px rgba(28,48,30,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;text-size-adjust:100%;-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d4d2ce;border-radius:4px}

  .app{display:flex;min-height:100vh}

  /* 侧边栏 */
  .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--sidebar) 0%,var(--bg2) 100%);border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .25s}
  .sidebar .brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sidebar .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2383e2 0%,#6940a5 50%,#d9730d 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;box-shadow:0 2px 8px rgba(35,131,226,.3)}
  .sidebar .brand .bt{font-weight:600;font-size:15px;background:linear-gradient(90deg,#2383e2,#6940a5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sidebar .brand .bs{font-size:11px;color:var(--ink-faint);display:block;margin-top:-2px}
  .nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 6px}
  .nav-label{font-size:11px;color:var(--ink-faint);padding:10px 10px 6px;font-weight:600;letter-spacing:.5px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);transition:all .15s;margin-bottom:2px;width:100%;text-align:left;min-height:42px}
  .nav-item:hover{background:rgba(0,0,0,.04);transform:translateX(2px)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500;box-shadow:inset 3px 0 0 var(--accent)}
  .nav-item .ni-ico{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .nav-item .ni-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .ni-count{font-size:11px;color:var(--ink-faint);background:var(--bg);padding:0 7px;border-radius:8px;line-height:17px}
  .nav-item.active .ni-count{background:#fff;color:var(--accent)}
  .nav-item .ni-del{opacity:0;color:var(--ink-faint);font-size:13px;padding:0 2px}
  .nav-item:hover .ni-del{opacity:1}
  .nav-item .ni-del:hover{color:var(--red)}
  .nav-add{margin:6px 10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;border:1px dashed var(--line-strong);transition:all .15s}
  .nav-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .sidebar .foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-faint);flex-wrap:wrap}
  .sidebar .foot button{padding:6px 9px;border-radius:6px;font-size:11px;color:var(--ink-soft);border:1px solid var(--line);background:#fff;min-height:30px}
  .sidebar .foot button:hover{background:var(--bg)}

  .ico.c1{background:var(--accent-soft);color:var(--accent)}
  .ico.c2{background:var(--orange-soft);color:var(--orange)}
  .ico.c3{background:var(--purple-soft);color:var(--purple)}
  .ico.c4{background:var(--green-soft);color:var(--green)}
  .ico.c5{background:var(--pink-soft);color:var(--pink)}
  .ico.c6{background:var(--yellow-soft);color:var(--yellow)}
  .ico.c7{background:var(--teal-soft);color:var(--teal)}

  /* 主内容 */
  .main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}
  .topbar{padding:14px 28px;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
  .topbar h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
  .topbar h2 .h-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .topbar .right{display:flex;gap:8px;align-items:center}
  .mb-btn{padding:7px 16px;border-radius:8px;font-size:12px;color:var(--ink-soft);border:1px solid var(--line);display:flex;align-items:center;gap:5px;background:#fff;transition:all .12s;min-height:34px}
  .mb-btn:hover{background:var(--bg);transform:translateY(-1px)}
  .mb-btn.primary{background:linear-gradient(135deg,var(--accent),#1a6fc0);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(35,131,226,.3)}
  .mb-btn.primary:hover{box-shadow:0 4px 12px rgba(35,131,226,.4)}
  .content{padding:24px 28px 80px;flex:1}
  .quote-card,.stat-card,.dash-widget,.card,.detail-card,.tl-content,.modal,.quick-nav button{background:var(--card);color:var(--ink)}
  .sidebar .foot button,.nav-item.active .ni-count{background:var(--card)}
  :root[data-theme="dark"] .dash-hero{background:linear-gradient(135deg,#242424 0%,#252230 50%,#1f2a35 100%);border-color:var(--line)}
  :root[data-theme="dark"] .dash-clock{color:var(--ink)}
  :root[data-theme="dark"] .quote-card,
  :root[data-theme="dark"] .stat-card,
  :root[data-theme="dark"] .dash-widget,
  :root[data-theme="dark"] .card,
  :root[data-theme="dark"] .detail-card,
  :root[data-theme="dark"] .tl-content{border-color:var(--line)}
  :root[data-theme="dark"] .card .cside{background:linear-gradient(180deg,var(--bg2),var(--bg));border-color:var(--line)}
  :root[data-theme="dark"] input,
  :root[data-theme="dark"] textarea,
  :root[data-theme="dark"] select{background:#1b1b1b;border-color:var(--line);color:var(--ink)}

  /* 首页桌面 */
  .dashboard{max-width:800px;margin:0 auto}
  .dash-hero{background:linear-gradient(135deg,#fdfcf8 0%,#f3f0fa 50%,#e8f1fb 100%);border-radius:16px;padding:60px 30px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:20px;position:relative;overflow:hidden}
  .dash-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(35,131,226,.08),transparent);pointer-events:none}
  .dash-clock{font-size:58px;font-weight:200;letter-spacing:3px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
  .dash-clock .sec{color:var(--accent);font-size:38px}
  .dash-date{font-size:15px;color:var(--ink-soft);margin-top:8px}
  .dash-greet{font-size:13px;color:var(--ink-faint);margin-top:4px}
  .dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  /* 桌面自定义卡片 */
  .dash-widgets{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
  .dash-widget{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px 20px;position:relative;overflow:hidden;transition:transform .15s}
  .dash-widget:hover{transform:translateY(-2px)}
  .dash-widget.size-small{grid-column:span 1;min-height:90px}
  .dash-widget.size-medium{grid-column:span 1;min-height:140px}
  .dash-widget.size-large{grid-column:span 2;min-height:180px}
  .dash-widget .dw-del{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);opacity:0;font-size:13px;background:rgba(255,255,255,.85);z-index:2}
  .dash-widget:hover .dw-del{opacity:1}
  .dash-widget .dw-del:hover{color:var(--red);background:#fff}
  .dash-widget h4{font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:10px;letter-spacing:.5px}
  .dash-widget .dw-content{font-size:14px;color:var(--ink);line-height:1.7;white-space:pre-wrap}
  .quote-card{background:#fff;border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);border-left:4px solid var(--accent);cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
  .quote-card::before{content:'❝';position:absolute;top:10px;right:16px;font-size:48px;color:var(--accent-soft);font-family:Georgia,serif;line-height:1}
  .quote-card:hover{transform:translateY(-2px)}
  .quote-card .qh{font-size:11px;color:var(--ink-faint);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .quote-card .qh .edit{cursor:pointer;padding:2px 8px;border-radius:5px}
  .quote-card .qh .edit:hover{background:var(--bg)}
  .quote-search{position:relative}
  .quote-search-results{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
  .quote-search-results .qsr-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .quote-search-results .qsr-item:hover{background:var(--accent-soft)}
  .qsr-item .qsr-text{font-size:13px;color:var(--ink);line-height:1.6}
  .qsr-item .qsr-author{font-size:11px;color:var(--ink-faint);margin-top:2px}
  /* 长按菜单 */
  .lp-menu{position:fixed;z-index:120;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:6px;min-width:140px;display:none;border:1px solid var(--line)}
  .lp-menu.show{display:block;animation:pop .15s ease}
  .lp-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;border-radius:7px;font-size:13px;color:var(--ink);text-align:left;transition:background .12s}
  .lp-menu button:hover{background:var(--bg)}
  .lp-menu button.danger{color:var(--red)}
  .lp-menu button.danger:hover{background:var(--red-soft)}
  .lp-menu .lp-sep{height:1px;background:var(--line);margin:4px 0}
  .lp-menu button .lp-ico{width:18px;text-align:center}
  .quote-card .qt{font-size:14px;color:var(--ink);line-height:1.8;font-weight:500;position:relative;z-index:1}
  .quote-card .qa{font-size:12px;color:var(--ink-faint);margin-top:8px;text-align:right;position:relative;z-index:1}
  .stat-card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
  .stat-card h4{font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:14px;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stat-item{text-align:center;padding:8px 4px;border-radius:10px;background:var(--bg);transition:transform .12s}
  .stat-item:hover{transform:scale(1.03)}
  .stat-item .num{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:block}
  .stat-item .lbl{font-size:11px;color:var(--ink-faint);margin-top:2px}
  .quick-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .quick-nav button{padding:10px 18px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);transition:all .15s;font-weight:500;min-height:42px}
  .quick-nav button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .list-tools{max-width:780px;margin:0 auto 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .list-tools input{flex:1;min-width:180px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .list-tools button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink-soft);font-size:12px;min-height:38px}
  .list-tools button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  /* 卡片列表（纵向单列）*/
  .card-list{display:flex;flex-direction:column;gap:10px;max-width:780px;margin:0 auto}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .load-more{display:block;margin:16px auto;padding:10px 18px;border-radius:8px;font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);min-height:40px}
  .load-more:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.02);overflow:hidden;display:flex;transition:all .15s;position:relative}
  .card-list .card{flex-direction:row;align-items:stretch}
  .card-list .card .drag-handle{width:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:grab;font-size:16px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);user-select:none}
  .card-list .card .drag-handle:active{cursor:grabbing}
  .card:hover{box-shadow:0 4px 12px rgba(15,15,15,.08),0 12px 28px rgba(15,15,15,.06);transform:translateY(-1px)}
  .card .cbody{padding:12px 14px;flex:1;min-width:0}
  .card .cside{width:auto;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px 14px;border-left:1px solid var(--line);background:linear-gradient(180deg,var(--bg),var(--bg2));font-size:11px;color:var(--ink-faint);min-width:100px;text-align:right;flex-shrink:0}
  .card .cside .cside-date{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .card .cside .cside-sub{font-size:10px}
  .card .cfoot{padding:7px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-faint)}
  .card .cdel{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);opacity:0;transition:all .12s;font-size:13px;background:rgba(255,255,255,.85);z-index:2}
  .card:hover .cdel{opacity:1}
  .card .cdel:hover{color:var(--red);background:#fff}
  .card .cimg{width:100%;max-height:240px;object-fit:cover;border-radius:8px;margin-bottom:8px}
  .card.dragging{opacity:.4;border:2px dashed var(--accent)!important}
  .card.drag-over{border-top:3px solid var(--accent)!important}
  .card.lp-active{box-shadow:0 0 0 2px var(--accent);transform:scale(.98)}

  .card.handwritten{font-family:"Kaiti SC","STKaiti","KaiTi","楷体",cursive;background:#fffef5;border:1px solid #f0e9c8}
  .card.handwritten .cbody{line-height:1.9;font-size:15px;color:#5a4a2a}
  .card.handwritten.sticky{background:linear-gradient(135deg,#fff9b1,#fff5a0);border:none;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .card.handwritten.sticky.blue{background:linear-gradient(135deg,#b8e0ff,#a0d4ff)}
  .card.handwritten.sticky.pink{background:linear-gradient(135deg,#ffc8dd,#ffb3cc)}
  .card.handwritten.sticky.green{background:linear-gradient(135deg,#c8f7c5,#a8f0a0)}
  .card.handwritten.sticky.purple{background:linear-gradient(135deg,#e0c8ff,#d4b3ff)}

  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:5px;font-weight:500}
  .tag.todo{background:var(--orange-soft);color:var(--orange)}
  .tag.doing{background:var(--accent-soft);color:var(--accent)}
  .tag.done{background:var(--green-soft);color:var(--green)}
  .tag.urgent{background:var(--red-soft);color:var(--red)}
  .tag.normal{background:var(--bg);color:var(--ink-soft)}
  .tag.low{background:var(--bg);color:var(--ink-faint)}
  .check{width:16px;height:16px;border:1.5px solid #c8c7c4;border-radius:4px;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .check.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .check.done svg{display:block}
  .check svg{display:none;width:10px;height:10px}
  .empty{padding:50px 20px;text-align:center;color:var(--ink-faint);font-size:13px}
  .empty .emoji{font-size:42px;display:block;margin-bottom:8px;opacity:.5}

  /* 时间线 */
  .detail-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .detail-header .back{padding:7px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;transition:all .12s}
  .detail-header .back:hover{background:var(--bg);transform:translateX(-2px)}
  .detail-title{font-size:18px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
  .detail-title .dt-start{font-size:12px;color:var(--ink-faint);font-weight:400}
  .detail-body{max-width:720px;margin:0 auto}
  .detail-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:24px 28px}

.sync-relay-note{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.5}

function openDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME);if(!db.objectStoreNames.contains(FILE_STORE))db.createObjectStore(FILE_STORE,{keyPath:'id'});if(!db.objectStoreNames.contains(RECOVERY_STORE))db.createObjectStore(RECOVERY_STORE);if(!db.objectStoreNames.contains(SYNC_META_STORE))db.createObjectStore(SYNC_META_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbStorePut(store,value,key){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite');
    if(key===undefined)tx.objectStore(store).put(value);else tx.objectStore(store).put(value,key);
    tx.oncomplete=()=>{db.close();resolve()};
    tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function idbStoreGet(store,key){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function idbGet(key){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readonly');

    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function saveFileBlob(file,kind){
  const rec={id:'file_'+Date.now().toString(36)+'_'+uid(),name:file.name||'附件',type:file.type||'application/octet-stream',size:file.size||0,kind,createdAt:new Date().toISOString(),blob:file};
  await idbStorePut(FILE_STORE,rec);
  return {fileId:rec.id,name:rec.name,type:rec.type,size:rec.size,kind:rec.kind};
}
function isFileRef(v){return v&&typeof v==='object'&&v.fileId}
async function fileRefUrl(ref){
  if(!isFileRef(ref))return ref||'';
  if(fileUrlCache.has(ref.fileId))return fileUrlCache.get(ref.fileId);
  const rec=await idbStoreGet(FILE_STORE,ref.fileId);
  if(!rec||!rec.blob)return '';
  const url=URL.createObjectURL(rec.blob);
  if(fileUrlCache.size>=FILE_URL_CACHE_MAX){const oldest=fileUrlCache.keys().next().value;if(oldest!==undefined){URL.revokeObjectURL(fileUrlCache.get(oldest));fileUrlCache.delete(oldest)}}
  fileUrlCache.set(ref.fileId,url);
  return url;
}
function resetAttachDraft(){if(pendingAttachPreview){URL.revokeObjectURL(pendingAttachPreview);pendingAttachPreview=null}pendingAttach=null;pendingAttachType=null}
function renderImgRef(ref,label,cls=''){
  if(!ref)return '';
  if(isFileRef(ref))return `<img class="${cls}" data-file-id="${esc(ref.fileId)}" alt="${esc(label||ref.name||'图片')}" style="width:100%;max-height:400px;object-fit:cover;border-radius:10px;cursor:pointer">`;
  return `<img class="${cls}" src="${ref}" alt="${esc(label||'图片')}" style="width:100%;max-height:400px;object-fit:cover;border-radius:10px;cursor:pointer" onclick="viewImgSrc('${ref}')">`;
}
async function resolveFileRefs(){
  const imgs=[...document.querySelectorAll('img[data-file-id]')];
  await Promise.all(imgs.map(async img=>{const id=img.dataset.fileId;const url=await fileRefUrl({fileId:id});if(url){img.src=url;img.onclick=()=>viewImgSrc(url)}}));
}
async function idbSet(key,value){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(value,key);
    tx.oncomplete=()=>{db.close();resolve()};
    tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
function cloneState(value){return typeof structuredClone==='function'?structuredClone(value):JSON.parse(JSON.stringify(value))}
function createDeviceId(){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('')}
function normalizeStateMeta(value){return value&&Number.isSafeInteger(value.revision)&&value.revision>=0&&typeof value.token==='string'&&value.token?{revision:value.revision,token:value.token}:{revision:0,token:null}}
function sameStateMeta(left,right){return left.revision===right.revision&&left.token===right.token}
function createStateToken(){return createDeviceId()}
function visibleStateJson(value){return JSON.stringify(value,(key,item)=>key==='_sync'?undefined:item)}
function readPendingJournal(){
  try{
    const parsed=JSON.parse(localStorage.getItem(PENDING_JOURNAL_KEY)||'null');
    if(!parsed||parsed.version!==1||!parsed.state||!parsed.state.modules)return null;
    return {baseMeta:normalizeStateMeta(parsed.baseMeta),state:parsed.state};
  }catch(error){console.warn('待提交本地日志读取失败:',error);return null}
}
function writePendingJournal(){
  try{
    localStorage.setItem(PENDING_JOURNAL_KEY,JSON.stringify({version:1,baseMeta:persistedStateMeta,state:cloneState(state)}));
  }catch(error){console.warn('待提交本地日志写入失败，继续使用 IndexedDB:',error)}
}
function clearPendingJournalIfMatches(snapshot,baseMeta){
  try{
    const pending=readPendingJournal();
    if(pending&&sameStateMeta(pending.baseMeta,baseMeta)&&visibleStateJson(pending.state)===visibleStateJson(snapshot))localStorage.removeItem(PENDING_JOURNAL_KEY);
  }catch(error){console.warn('待提交本地日志清理失败:',error)}
}
async function loadDeviceId(){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    let id;
    const tx=db.transaction(SYNC_META_STORE,'readwrite');
    const store=tx.objectStore(SYNC_META_STORE);
    const req=store.get(DEVICE_ID_KEY);
    req.onsuccess=()=>{
      id=req.result;
      if(typeof id!=='string'||!id){id=createDeviceId();store.put(id,DEVICE_ID_KEY)}
    };
    tx.oncomplete=()=>{db.close();resolve(id)};
    tx.onerror=()=>{db.close();reject(tx.error)};
    tx.onabort=()=>{db.close();reject(tx.error||new Error('deviceId transaction aborted'))};
  });
}
async function readPersistedState(){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction([STORE_NAME,SYNC_META_STORE],'readonly');
    const stateReq=tx.objectStore(STORE_NAME).get(KEY);
    const metaReq=tx.objectStore(SYNC_META_STORE).get(STATE_REVISION_KEY);
    tx.oncomplete=()=>{const result={state:stateReq.result,meta:normalizeStateMeta(metaReq.result)};db.close();resolve(result)};
    tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function compareAndSetState(expected,stateValue,nextMeta){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    let committed=false,currentMeta={revision:0,token:null};
    const tx=db.transaction([STORE_NAME,SYNC_META_STORE],'readwrite');
    const metaStore=tx.objectStore(SYNC_META_STORE);
    const req=metaStore.get(STATE_REVISION_KEY);
    req.onsuccess=()=>{
      currentMeta=normalizeStateMeta(req.result);
      if(!sameStateMeta(currentMeta,expected))return;
      tx.objectStore(STORE_NAME).put(stateValue,KEY);
      metaStore.put(nextMeta,STATE_REVISION_KEY);
      committed=true;
    };
    tx.oncomplete=()=>{db.close();resolve({committed,currentMeta})};
    tx.onerror=()=>{db.close();reject(tx.error)};
    tx.onabort=()=>{db.close();reject(tx.error||new Error('state transaction aborted'))};
  });
}
function staleStateError(){
  toast('其他标签页已保存新数据，本页未覆盖。请刷新后再继续。');
  const error=new Error('stale state conflict');
  error.code='STALE_STATE';
  return error;
}
function withStateWriteLock(task){return navigator.locks&&navigator.locks.request?navigator.locks.request(STATE_WRITE_LOCK,{mode:'exclusive'},task):task()}
async function hydrateState(){
  let migratedLegacy=false,themeChanged=false,pendingRecovery=false;
  try{
    const persisted=await readPersistedState();
    const saved=persisted.state;
    persistedStateMeta=persisted.meta;
    const pending=readPendingJournal();
    if(saved&&saved.modules){state=saved}
    else{
      const old=JSON.parse(localStorage.getItem(KEY)||'null');
      if(old&&old.modules){state=old;migratedLegacy=true}
    }
    if(pending){
      if(sameStateMeta(pending.baseMeta,persistedStateMeta)){state=pending.state;pendingRecovery=true}
      else if(!saved||visibleStateJson(pending.state)===visibleStateJson(saved))localStorage.removeItem(PENDING_JOURNAL_KEY);
      else{console.warn('发现过期待提交本地日志，保留 IndexedDB 数据');localStorage.removeItem(PENDING_JOURNAL_KEY)}
    }
    state=await SyncCore.migrateState(state);
    deviceId=await loadDeviceId();
    if(migratedLegacy){await idbSet(KEY,state);localStorage.setItem(KEY+'_migrated','1')}
    persistedShadow=cloneState(state);
    backupDirHandle=await idbGet(BACKUP_DIR_KEY);
  }catch(e){console.warn('IndexedDB 加载失败，使用默认数据:',e)}
  if(!deviceId){try{deviceId=await loadDeviceId()}catch(e){console.warn('设备标识加载失败:',e)}}
  if(!persistedShadow){state=await SyncCore.migrateState(state);persistedShadow=cloneState(state)}
  if(state.settings&&state.settings.theme==='warm'&&!state.settings.themeExplicit){state.settings.theme='default';themeChanged=true}
  hydrated=true;
  if(pendingRecovery){try{await saveNow()}catch(error){reportBackgroundSaveError(error)}}
  applyTheme();renderNav();renderContent();updateStorageInfo();
  if(themeChanged)save();
}
function saveNow(){
  const persist=async()=>{
    if(!hydrated&&hydrationPromise)await hydrationPromise;
    if(!deviceId)deviceId=await loadDeviceId();
    const revision=stateRevision;
    const snapshot=cloneState(state);
    return withStateWriteLock(async()=>{
      const current=await readPersistedState();
      if(!sameStateMeta(current.meta,persistedStateMeta))throw staleStateError();
      const stamped=await SyncCore.stampChanges(snapshot,current.state||persistedShadow||snapshot,deviceId);
      const nextMeta={revision:current.meta.revision+1,token:createStateToken()};
      const result=await compareAndSetState(current.meta,stamped,nextMeta);
      if(!result.committed)throw staleStateError();
      clearPendingJournalIfMatches(stamped,current.meta);
      persistedStateMeta=nextMeta;
      persistedShadow=cloneState(stamped);
      persistedRevision=revision;
      if(stateRevision===revision)state=stamped;
      return cloneState(stamped);
    });
  };
  saveChain=saveChain.then(persist,persist).catch(e=>{console.warn('IndexedDB 保存失败:',e);throw e});
  return saveChain;
}
function reportBackgroundSaveError(error){
  if(error&&error.code==='STALE_STATE')return;
  console.warn('IndexedDB 保存失败:',error);
  toast('本机保存失败，请重试或先导出备份。');
}
function scheduleSave(){

    saveNow().catch(reportBackgroundSaveError);
  });

function save(){

function saveWidget(){

/* 实验/书籍列表卡片（含开始日期）*/
function stableBookColor(id){
  const colors=['#6940a5,#2383e2','#d9730d,#e03e3e','#0f7b3d,#2383e2','#ad1a72,#6940a5','#0d7d7d,#2383e2'];
  let hash=0;const s=String(id||'');
  for(let i=0;i<s.length;i++)hash=(hash*31+s.charCodeAt(i))>>>0;
  return colors[hash%colors.length];
}

  let body='';
    if(m.type==='experiment'){

      const c=lg.progress>=100?'var(--green)':lg.progress>=50?'var(--accent)':'var(--orange)';

    }).join(''):empty('暂无进度记录，点击右上角添加');
  }else{
    body=logs.length?logs.map(lg=>{

      return `<div class="tl-item"><div class="tl-time"><div class="tl-date">${esc((lg.date||'').slice(5))}</div><div class="tl-sub">${esc((lg.date||'').slice(0,4))}</div></div><div class="tl-axis"><div class="tl-dot"></div></div><div class="tl-content" data-lid="${lg.id}"><button class="tl-del" onclick="delLog('${lg.id}')" aria-label="删除这条阅读记录">🗑</button><div class="tl-title">读到第 ${lg.page||0} 页 · ${pct}%</div>${lg.feeling?`<div class="tl-desc" style="margin-bottom:6px"><strong>感想：</strong>${esc(lg.feeling)}</div>`:''}${lg.note?`<div class="tl-desc" style="color:var(--ink-faint)"><strong>笔记：</strong>${esc(lg.note)}</div>`:''}${lgImg?renderImgRef(lgImg,'记录图片','tl-img'):''}${attachLink(lg)}<span class="tl-edit" onclick="editLog('${lg.id}')" role="button" aria-label="编辑这条阅读记录">✎ 编辑</span></div></div>`;

function getTitle(item,type){
  if(type==='task'||type==='todo')return esc(item.txt||'');
  if(type==='paper')return esc(item.title||'');
  if(type==='meeting')return esc(item.title||'');
  if(type==='diary')return esc((item.mood||'')+' '+(item.title||''));
  if(type==='note')return esc(item.title||'内容详情');
  if(type==='experiment'||type==='book')return esc(item.name||'');
  return '详情';
}

    card.addEventListener('click',e=>{
      if(e.target.closest('.check,.cdel,.drag-handle'))return;
      if(lpTriggered){e.preventDefault();e.stopPropagation();return;}
      openDetail(id);
    });
    // 拖拽排序
    card.addEventListener('dragstart',e=>{
      if(lpTimer){clearTimeout(lpTimer)}
      if(!e.target.closest('.drag-handle')&&!e.target.closest('.card')){e.preventDefault();return}
      dragSrc=card;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'))});
    card.addEventListener('dragover',e=>{e.preventDefault();if(card!==dragSrc)card.classList.add('drag-over')});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drag-over');
      if(!dragSrc||dragSrc===card)return;
      const m=state.modules[currentMod];
      const srcId=dragSrc.dataset.id,dstId=card.dataset.id;
      const srcIdx=m.items.findIndex(x=>x.id===srcId),dstIdx=m.items.findIndex(x=>x.id===dstId);
      if(srcIdx<0||dstIdx<0)return;
      const [moved]=m.items.splice(srcIdx,1);m.items.splice(dstIdx,0,moved);
      save();renderContent();
    });
  });
}

/* 通用长按绑定 */
let lpTriggered=false;
function bindLp(el,getCtx,opts={}){
  let timer=null;
  const start=(e)=>{
    if(opts.exclude&&e.target.closest(opts.exclude))return;
    lpTriggered=false;
    timer=setTimeout(()=>{
      lpTriggered=true;
      el.classList.add('lp-active');
      const rect=el.getBoundingClientRect();
      showLpMenu(e,rect,getCtx(rect));
      setTimeout(()=>el.classList.remove('lp-active'),300);
    },600);
  };
  const cancel=(e)=>{
    if(timer){clearTimeout(timer);timer=null}
  };
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
  el.addEventListener('touchstart',start);
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchmove',cancel);
  el.addEventListener('contextmenu',e=>{if(!e.target.closest(opts.exclude||''))e.preventDefault()});
  el.addEventListener('click',e=>{
    if(lpTriggered){e.preventDefault();e.stopPropagation();lpTriggered=false;}
  },true);
}

/* 长按菜单 */
function showLpMenu(e,rect,ctx){
  lpContext=ctx;
  const menu=document.getElementById('lpMenu');
  let x=rect.left,y=rect.bottom+6;
  if(e.touches){x=e.touches[0].clientX;y=e.touches[0].clientY+10}
  // 防止超出屏幕
  if(x+160>window.innerWidth)x=window.innerWidth-170;
  if(y+240>window.innerHeight)y=rect.top-240;
  menu.style.left=x+'px';menu.style.top=y+'px';
  menu.classList.add('show');
}
function hideLpMenu(){document.getElementById('lpMenu').classList.remove('show');lpContext=null}
document.addEventListener('click',e=>{if(!e.target.closest('.lp-menu')&&!e.target.closest('.card')&&!e.target.closest('.dash-widget'))hideLpMenu()});
function lpAction(action){
  if(!lpContext){hideLpMenu();return}
  const ctx=lpContext;hideLpMenu();
  if(ctx.type==='item'){
    const m=state.modules[currentMod];const idx=m.items.findIndex(x=>x.id===ctx.id);
    if(idx<0)return;
    if(action==='edit'){editingId=ctx.id;openUnifiedEditModal(ctx.id)}
    else if(action==='editMeta'){openUnifiedEditModal(ctx.id)}
    else if(action==='up'&&idx>0){[m.items[idx-1],m.items[idx]]=[m.items[idx],m.items[idx-1]];save();renderContent()}
    else if(action==='down'&&idx<m.items.length-1){[m.items[idx+1],m.items[idx]]=[m.items[idx],m.items[idx+1]];save();renderContent()}
    else if(action==='delete'){if(confirm('确定删除？')){m.items=m.items.filter(x=>x.id!==ctx.id);save();renderContent();renderNav();toast('已删除')}}
  }else if(ctx.type==='widget'){
    const arr=state.dashWidgets;const idx=arr.findIndex(x=>x.id===ctx.id);
    if(idx<0)return;
    if(action==='edit'||action==='editMeta'){openWidgetModal(ctx.id)}
    else if(action==='up'&&idx>0){[arr[idx-1],arr[idx]]=[arr[idx],arr[idx-1]];save();renderContent()}
    else if(action==='down'&&idx<arr.length-1){[arr[idx+1],arr[idx]]=[arr[idx],arr[idx+1]];save();renderContent()}
    else if(action==='delete'){if(confirm('确定删除？')){state.dashWidgets=arr.filter(x=>x.id!==ctx.id);save();renderContent();toast('已删除')}}
  }else if(ctx.type==='quote'){
    if(action==='edit'||action==='editMeta')openQuoteModal();
    else if(action==='up'||action==='down'){nextQuote();toast('已切换')}
    else if(action==='delete'){if(state.customQuotes.length<=1){toast('至少保留一句激励语')}else if(confirm('确定删除当前激励语？')){state.customQuotes.splice(state.activeQuote,1);if(state.activeQuote>=state.customQuotes.length)state.activeQuote=0;save();renderContent();toast('已删除')}}
  }else if(ctx.type==='stats'){
    if(action==='edit'||action==='editMeta')toast('今日概览自动统计，无需编辑');
    else if(action==='up'||action==='down')toast('今日概览固定位置，不支持移动');
    else if(action==='delete')toast('今日概览不支持删除');
  }else if(ctx.type==='nav-module'){
    const idx=state.moduleOrder.indexOf(ctx.mid);if(idx<0)return;
    if(action==='edit'||action==='editMeta')editModuleMeta(ctx.mid);
    else if(action==='up'&&idx>0){[state.moduleOrder[idx-1],state.moduleOrder[idx]]=[state.moduleOrder[idx],state.moduleOrder[idx-1]];save();renderNav();renderContent()}
    else if(action==='down'&&idx<state.moduleOrder.length-1){[state.moduleOrder[idx+1],state.moduleOrder[idx]]=[state.moduleOrder[idx],state.moduleOrder[idx+1]];save();renderNav();renderContent()}
    else if(action==='delete'){if(state.modules[ctx.mid].custom){delMod(ctx.mid)}else{toast('内置模块不能删除，但可编辑')}}
  }else if(ctx.type==='log'){
    const m=state.modules[currentMod];const item=m.items.find(x=>x.id===detailId);if(!item)return;
    const logs=item.logs||[];const idx=logs.findIndex(x=>x.id===ctx.lid);if(idx<0)return;
    if(action==='edit'||action==='editMeta'){editingId=ctx.lid;openLogModal(detailId,ctx.lid)}
    else if(action==='up'&&idx>0){[logs[idx-1],logs[idx]]=[logs[idx],logs[idx-1]];save();renderContent()}
    else if(action==='down'&&idx<logs.length-1){[logs[idx+1],logs[idx]]=[logs[idx],logs[idx+1]];save();renderContent()}
    else if(action==='delete'){if(confirm('确定删除这条记录？')){item.logs=logs.filter(x=>x.id!==ctx.lid);recalcSummary(item,m.type);save();renderContent();renderNav();toast('已删除')}}
  }
}

  }

    f+=`<div class="field"><label>心情</label><input id="meta_mood" value="${esc(item.mood||'')}"></div>`;
  }
  if(type==='note'){
    f+=`<div class="field"><label>标题</label><input id="meta_title" value="${esc(item.title||'')}"></div>`;
  }
  if(type==='experiment'||type==='book'){
    f+=`<div class="field"><label>名称</label><input id="meta_name" value="${esc(item.name||'')}"></div>`;

function saveUnifiedEdit(){
  const m=state.modules[currentMod];const type=m.type;const id=editingId;const item=m.items.find(x=>x.id===id);if(!item)return;
  // 先保存内容表单（复用已有字段逻辑）

    const txt=val('f_txt');if(txt)item.txt=txt;
    item.status=val('f_status');item.priority=val('f_priority');item.due=val('f_due');item.done=val('f_status')==='done';
  }else if(type==='todo'){
    const txt=val('f_txt');if(txt)item.txt=txt;
    item.priority=val('f_priority');
  }else if(type==='paper'){
    const title=val('f_title');if(title)item.title=title;
    item.info=val('f_info');item.summary=val('f_summary');item.tags=val('f_tags').split(',').map(s=>s.trim()).filter(Boolean);

  if(document.getElementById('meta_priority'))item.priority=val('meta_priority');
  if(document.getElementById('meta_due'))item.due=val('meta_due');
  if(document.getElementById('meta_title'))item.title=val('meta_title');
  if(document.getElementById('meta_info'))item.info=val('meta_info');
  if(document.getElementById('meta_tags'))item.tags=val('meta_tags').split(',').map(s=>s.trim()).filter(Boolean);
  if(document.getElementById('meta_date'))item.date=val('meta_date');
  if(document.getElementById('meta_mood'))item.mood=val('meta_mood');
  if(document.getElementById('meta_name'))item.name=val('meta_name');
  if(document.getElementById('meta_author'))item.author=val('meta_author');
  if(document.getElementById('meta_total'))item.total=+val('meta_total')||0;

/* 附件 */
function attachField(label,existing,attType){
  const cur=attType||'img';
  const imgPreview=existing&&attType==='img'?(isFileRef(existing)?renderImgRef(existing,'已上传图片'):`<img src="${existing}" alt="已上传图片">`):`<div class="ph"><span>📷</span>点击上传图片</div>`;

  return `<div class="field"><label>${label||'附件'}</label><div class="attach-tabs" id="attTabs"><button class="${cur==='img'?'active':''}" onclick="setAttTab('img',this)" aria-label="切换到图片附件">🖼 图片</button><button class="${cur==='doc'?'active':''}" onclick="setAttTab('doc',this)" aria-label="切换到文档附件">📄 文档</button><button class="${cur==='link'?'active':''}" onclick="setAttTab('link',this)" aria-label="切换到链接附件">🔗 链接</button></div><div id="attImgArea" style="display:${cur==='img'?'block':'none'}"><div class="upload-area ${existing&&attType==='img'?'has-file':''}" id="attUpload">${imgPreview}</div><input type="file" id="attFile" accept="image/*" style="display:none"></div><div id="attDocArea" style="display:${cur==='doc'?'block':'none'}"><div class="upload-area ${existing&&attType==='doc'?'has-file':''}" id="attDocUpload">${existing&&attType==='doc'?`<div style="font-size:13px;padding:8px">📄 ${esc(docName)}</div>`:`<div class="ph"><span>📄</span>点击上传文档（PDF/Word等）</div>`}</div><input type="file" id="attDocFile" style="display:none"></div><div id="attLinkArea" style="display:${cur==='link'?'block':'none'}"><input id="attLinkInput" value="${existing&&attType==='link'?esc(existing):''}" placeholder="https://..."></div></div>`;
}
let curAttTab='img';
function setAttTab(tab,btn){curAttTab=tab;document.querySelectorAll('#attTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('attImgArea').style.display=tab==='img'?'block':'none';document.getElementById('attDocArea').style.display=tab==='doc'?'block':'none';document.getElementById('attLinkArea').style.display=tab==='link'?'block':'none';}
function bindAttach(){
  const up=document.getElementById('attUpload');const inp=document.getElementById('attFile');
  if(up&&inp){up.addEventListener('click',()=>inp.click());inp.addEventListener('change',e=>handleAttUpload(e,'img'))}
  const dup=document.getElementById('attDocUpload');const dinp=document.getElementById('attDocFile');
  if(dup&&dinp){dup.addEventListener('click',()=>dinp.click());dinp.addEventListener('change',e=>handleAttUpload(e,'doc'))}
}
async function handleAttUpload(e,type){const file=e.target.files[0];if(!file)return;if(file.size>25*1024*1024){toast('文件不能超过25MB');return}pendingAttach=await saveFileBlob(file,type);pendingAttachType=type;curAttTab=type;pendingAttachPreview=URL.createObjectURL(file);if(type==='img'){const up=document.getElementById('attUpload');up.className='upload-area has-file';up.innerHTML=`<img src="${pendingAttachPreview}" alt="已上传图片">`}if(type==='doc'){const up=document.getElementById('attDocUpload');up.className='upload-area has-file';up.innerHTML=`<div style="font-size:13px;padding:8px">📄 ${esc(file.name)}</div>`}toast('附件已保存到本机 Blob 存储');}
function getAttach(){if(curAttTab==='link'){const v=val('attLinkInput');return{attachment:v||null,attType:v?'link':null}}if(pendingAttach!==null)return{attachment:pendingAttach,attType:pendingAttachType};return{attachment:null,attType:null}}

/* OCR */
async function doOCR(){
  const r=document.getElementById('ocrResult');
  const btn=document.getElementById('ocrBtn');
  if(!pendingAttach||pendingAttachType!=='img'){const up=document.getElementById('attUpload');const img=up&&up.querySelector('img');if(!img){r.textContent='请先在“图片”附件里上传论文截图，再使用联网 OCR。';return}pendingAttach=img.src;pendingAttachType='img'}
  if(btn){btn.disabled=true;btn.textContent='正在加载 OCR...'}
  r.textContent='需要联网加载 OCR 库，图片只在当前浏览器中参与识别。';
  if(typeof Tesseract==='undefined'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>runOCR();s.onerror=()=>{r.textContent='OCR 加载失败：请检查网络，或直接手动填写论文信息。';if(btn){btn.disabled=false;btn.textContent='🔍 联网识别论文截图'}};document.head.appendChild(s)}else{runOCR()}
}
async function runOCR(){const r=document.getElementById('ocrResult');const btn=document.getElementById('ocrBtn');if(btn)btn.textContent='识别中...';const source=isFileRef(pendingAttach)?(pendingAttachPreview||await fileRefUrl(pendingAttach)):pendingAttach;Tesseract.recognize(source,'eng+chi_sim',{logger:m=>{if(m.status==='recognizing text')r.textContent='识别中... '+Math.round(m.progress*100)+'%'}}).then(res=>{const text=res.data.text||'';r.innerHTML='识别完成：<br><span style="color:var(--ink-soft)">'+esc(text.slice(0,200))+(text.length>200?'...':'')+'</span>';const lines=text.split('\n').filter(l=>l.trim());if(lines.length){const titleEl=document.getElementById('f_title');const infoEl=document.getElementById('f_info');if(titleEl&&!titleEl.value)titleEl.value=lines[0].trim();if(infoEl&&!infoEl.value&&lines.length>1)infoEl.value=lines.slice(1,3).join(' · ');toast('已自动填入信息')}}).catch(e=>{r.textContent='识别失败：图片可能不清晰，或浏览器暂时无法完成 OCR。可以继续手动填写。'}).finally(()=>{if(btn){btn.disabled=false;btn.textContent='🔍 联网识别论文截图'}});}

/* 手写板（可全屏）*/
function handwriteField(existingImg){
  return `<div id="handwriteArea" style="display:none"><div class="field"><label>手写板 <button class="hw-expand" onclick="openHwOverlay()" style="float:right" aria-label="打开全屏手写板">⤢ 全屏</button></label><div class="hw-tools"><span>颜色：</span><button class="color-dot active" style="background:#37352f" onclick="setHwColor(this,'#37352f')" aria-label="选择黑色画笔"></button><button class="color-dot" style="background:#e03e3e" onclick="setHwColor(this,'#e03e3e')" aria-label="选择红色画笔"></button><button class="color-dot" style="background:#2383e2" onclick="setHwColor(this,'#2383e2')" aria-label="选择蓝色画笔"></button><button class="color-dot" style="background:#0f7b3d" onclick="setHwColor(this,'#0f7b3d')" aria-label="选择绿色画笔"></button><button class="color-dot" style="background:#d9730d" onclick="setHwColor(this,'#d9730d')" aria-label="选择橙色画笔"></button><span style="margin-left:auto">粗细：</span><input type="range" class="size" id="hwSize" min="1" max="8" value="2.5" step="0.5" onchange="hwState.width=+this.value" aria-label="调整画笔粗细"></div><div class="handwrite-area" id="hwBox" style="height:${hwHeight}px"><canvas id="hwCanvas"></canvas></div><div class="hw-actions"><button onclick="clearHw()" aria-label="清空手写内容">🗑 清空</button><button onclick="undoHw()" aria-label="撤销上一笔">↩ 撤销</button><button onclick="expandHw()" aria-label="扩大手写区域">⤢ 扩大</button><button onclick="shrinkHw()" aria-label="缩小手写区域">⤬ 缩小</button><button class="hw-expand" onclick="openHwOverlay()" aria-label="打开全屏手写板">⤢ 全屏</button></div>${existingImg?`<div style="margin-top:8px"><img src="${existingImg}" style="max-width:120px;border-radius:6px;border:1px solid var(--line)" alt="已有手写图"><br><span style="font-size:11px;color:var(--ink-faint)">已有手写图</span></div>`:''}</div></div>`;
}
function setupHandwrite(){
  const cvs=document.getElementById('hwCanvas');if(!cvs)return;
  const box=document.getElementById('hwBox');resizeCanvas(cvs,box);
  const ctx=cvs.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  const getP=e=>{const r=cvs.getBoundingClientRect();if(e.touches){const t=e.touches[0];return{x:t.clientX-r.left,y:t.clientY-r.top}}return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const start=e=>{e.preventDefault();hwState.isDrawing=true;const p=getP(e);hwState.currentPath=[p];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=hwState.color;ctx.lineWidth=hwState.width};
  const move=e=>{e.preventDefault();if(!hwState.isDrawing)return;const p=getP(e);ctx.lineTo(p.x,p.y);ctx.stroke();hwState.currentPath.push(p)};
  const end=e=>{e.preventDefault();if(!hwState.isDrawing)return;hwState.isDrawing=false;hwState.data.push({path:[...hwState.currentPath],color:hwState.color,width:hwState.width})};
  cvs.onmousedown=start;cvs.onmousemove=move;cvs.onmouseup=end;cvs.onmouseleave=end;
  cvs.ontouchstart=start;cvs.ontouchmove=move;cvs.ontouchend=end;
}
function resizeCanvas(cvs,box){if(!cvs||!box)return;cvs.width=box.clientWidth||400;cvs.height=box.clientHeight||220;}
function setHwColor(el,c){hwState.color=c;document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');}
function clearHw(){const cvs=document.getElementById('hwCanvas');if(!cvs)return;const ctx=cvs.getContext('2d');ctx.clearRect(0,0,cvs.width,cvs.height);hwState.data=[];}
function undoHw(){const cvs=document.getElementById('hwCanvas');if(!cvs)return;hwState.data.pop();redrawHw();}
function redrawHw(){const cvs=document.getElementById('hwCanvas');if(!cvs)return;const ctx=cvs.getContext('2d');ctx.clearRect(0,0,cvs.width,cvs.height);hwState.data.forEach(s=>{ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';s.path.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.stroke();});}
function expandHw(){hwHeight=Math.min(hwHeight+120,560);const box=document.getElementById('hwBox');if(box){box.style.height=hwHeight+'px';setTimeout(()=>{const cvs=document.getElementById('hwCanvas');resizeCanvas(cvs,box);redrawHw();},250)}}
function shrinkHw(){hwHeight=Math.max(hwHeight-120,180);const box=document.getElementById('hwBox');if(box){box.style.height=hwHeight+'px';setTimeout(()=>{const cvs=document.getElementById('hwCanvas');resizeCanvas(cvs,box);redrawHw();},250)}}
function resizeHandwrite(){const cvs=document.getElementById('hwCanvas');const box=document.getElementById('hwBox');if(!cvs||!box||box.clientWidth===0)return;if(cvs.width!==box.clientWidth||cvs.height!==box.clientHeight){resizeCanvas(cvs,box);redrawHw();}}
function getHwImage(){const cvs=document.getElementById('hwCanvas');if(!cvs)return null;const ctx=cvs.getContext('2d');const data=ctx.getImageData(0,0,cvs.width,cvs.height).data;let blank=true;for(let i=3;i<data.length;i+=4){if(data[i]!==0){blank=false;break}}if(blank)return null;return cvs.toDataURL('image/png');}

/* 全屏手写 */
function openHwOverlay(){
  // 先把当前小画板的数据同步
  const smallCvs=document.getElementById('hwCanvas');
  if(smallCvs){hwState.data=hwState.data||[]}
  document.getElementById('hwOverlay').classList.add('show');
  setTimeout(()=>{
    const cvs=document.getElementById('hwCanvasF');const wrap=cvs.parentElement;
    cvs.width=wrap.clientWidth;cvs.height=wrap.clientHeight;
    const ctx=cvs.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle='#fffef5';ctx.fillRect(0,0,cvs.width,cvs.height);
    // 重绘
    hwState.data.forEach(s=>{ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';s.path.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.stroke();});
    const getP=e=>{const r=cvs.getBoundingClientRect();if(e.touches){const t=e.touches[0];return{x:t.clientX-r.left,y:t.clientY-r.top}}return{x:e.clientX-r.left,y:e.clientY-r.top}};
    let curPath=[];
    const start=e=>{e.preventDefault();hwState.isDrawing=true;const p=getP(e);curPath=[p];ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=hwState.color;ctx.lineWidth=hwState.width};
    const move=e=>{e.preventDefault();if(!hwState.isDrawing)return;const p=getP(e);ctx.lineTo(p.x,p.y);ctx.stroke();curPath.push(p)};
    const end=e=>{e.preventDefault();if(!hwState.isDrawing)return;hwState.isDrawing=false;hwState.data.push({path:[...curPath],color:hwState.color,width:hwState.width})};
    cvs.onmousedown=start;cvs.onmousemove=move;cvs.onmouseup=end;
    cvs.ontouchstart=start;cvs.ontouchmove=move;cvs.ontouchend=end;
  },100);
}
function setHwColorF(el,c){hwState.color=c;document.querySelectorAll('#hwOverlay .color-dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');}
function clearHwF(){const cvs=document.getElementById('hwCanvasF');if(!cvs)return;const ctx=cvs.getContext('2d');ctx.fillStyle='#fffef5';ctx.fillRect(0,0,cvs.width,cvs.height);hwState.data=[];}
function undoHwF(){const cvs=document.getElementById('hwCanvasF');if(!cvs)return;hwState.data.pop();const ctx=cvs.getContext('2d');ctx.fillStyle='#fffef5';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.lineCap='round';ctx.lineJoin='round';hwState.data.forEach(s=>{ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;s.path.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.stroke();});}
function closeHwOverlay(){
  // 把全屏数据同步回小画板
  const bigCvs=document.getElementById('hwCanvasF');
  const smallCvs=document.getElementById('hwCanvas');
  document.getElementById('hwOverlay').classList.remove('show');
  if(smallCvs){setTimeout(()=>{const box=document.getElementById('hwBox');resizeCanvas(smallCvs,box);redrawHw();},100)}
}

/* 保存 */
function saveItemForm(){
  const m=state.modules[currentMod];const type=m.type;const id=editingId||uid();
  let newItem={id,createdAt:today()};
  if(editingId){const old=m.items.find(x=>x.id===editingId);if(old)Object.assign(newItem,old)}
  const att=getAttach();const hwImg=inputMode==='handwrite'?getHwImage():null;
  if(att.attachment!==null){newItem.attachment=att.attachment;newItem.attType=att.attType;if(att.attType==='img')newItem.img=att.attachment}else if(!editingId){newItem.attachment=null;newItem.attType=null;newItem.img=null}
  if(hwImg)newItem.hwImg=hwImg;
  if(type==='task'){const txt=val('f_txt');if(!txt){toast('请填写任务内容');return}Object.assign(newItem,{txt,status:val('f_status'),priority:val('f_priority'),due:val('f_due'),done:val('f_status')==='done'})}
  else if(type==='todo'){const txt=val('f_txt');if(!txt){toast('请填写待办内容');return}Object.assign(newItem,{txt,done:editingId?(m.items.find(x=>x.id===editingId)||{}).done||false:false,priority:val('f_priority')})}
  else if(type==='paper'){const title=val('f_title');if(!title){toast('请填写论文标题');return}Object.assign(newItem,{title,info:val('f_info'),summary:val('f_summary'),tags:val('f_tags').split(',').map(s=>s.trim()).filter(Boolean)})}
  else if(type==='meeting'){const title=val('f_title');if(!title){toast('请填写组会主题');return}Object.assign(newItem,{title,date:val('f_date')||today(),points:val('f_points').split('\n').map(s=>s.trim()).filter(Boolean)})}
  else if(type==='experiment'){const name=val('f_name');if(!name){toast('请填写实验名称');return}Object.assign(newItem,{name,progress:0,status:'刚启动',startDate:val('f_startDate')||today(),logs:editingId?newItem.logs||[]:[]})}
  else if(type==='book'){const name=val('f_name');if(!name){toast('请填写书名');return}Object.assign(newItem,{name,author:val('f_author'),total:+val('f_total')||0,page:0,startDate:val('f_startDate')||today(),logs:editingId?newItem.logs||[]:[]})}
  else if(type==='diary'){const moodEmoji=(document.querySelector('input[name="mood"]:checked')||{}).value||'';const moodText=val('f_mood_text');Object.assign(newItem,{date:val('f_date')||today(),mood:moodEmoji+(moodText?' '+moodText:''),title:val('f_title'),content:val('f_content')})}

function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function dataUrlToBlob(dataUrl){const [head,body]=dataUrl.split(',');const mime=(head.match(/data:(.*?);/)||[])[1]||'application/octet-stream';const bin=atob(body);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime})}
async function buildBackup(){
  const persisted=await saveNow();
  const ids=[...collectFileRefs(persisted)];
  const files=[];
  for(const id of ids){const rec=await idbStoreGet(FILE_STORE,id);if(rec&&rec.blob)files.push({id:rec.id,name:rec.name,type:rec.type,size:rec.size,kind:rec.kind,createdAt:rec.createdAt,dataUrl:await blobToDataUrl(rec.blob)})}
  return {app:'personal-hub',version:'v1-local-first',exportedAt:new Date().toISOString(),data:persisted,files};
}
async function buildBackupText(){return JSON.stringify(await buildBackup(),null,2)}
async function restoreBackupFiles(files){if(!files||!files.length)return;for(const f of files){await idbStorePut(FILE_STORE,{id:f.id,name:f.name,type:f.type,size:f.size,kind:f.kind,createdAt:f.createdAt,blob:dataUrlToBlob(f.dataUrl)})}}

function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{try{const parsed=JSON.parse(ev.target.result);const data=parsed&&parsed.data&&parsed.data.modules?parsed.data:parsed;const meta=parsed&&parsed.data?parsed:null;if(data&&data.modules){const modules=Object.keys(data.modules).length;const items=countBackupItems(data);const exported=meta&&meta.exportedAt?new Date(meta.exportedAt).toLocaleString():'旧版备份或未知';const version=meta&&meta.version?meta.version:'旧版/未知';const size=(file.size/1024).toFixed(1)+'KB';const fileCount=meta&&meta.files?meta.files.length:0;if(!confirm(`导入会覆盖当前本机数据。\\n\\n备份版本：${version}\\n导出时间：${exported}\\n模块数量：${modules}\\n条目数量：${items}\\n附件数量：${fileCount}\\n文件大小：${size}\\n\\n确定继续？`))return;await restoreBackupFiles(meta&&meta.files);state=data;state.settings=state.settings||{theme:'default'};applyTheme();save();renderNav();renderContent();toast('备份已导入')}else toast('文件格式不正确')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}};reader.readAsText(file);}

function formatSyncBytes(value){const bytes=Math.max(0,Number(value)||0);return bytes<1024?bytes+' B':(bytes/1024).toFixed(1)+' KB'}
function updateSyncScopeSummary(){const ids=selectedSyncModules(),includeAttachments=document.getElementById('syncScopeAttachments')?.checked===true;let count=0,bytes=0,attachmentBytes=0;ids.forEach(id=>{const m=state.modules[id];if(!m)return;const items=m.items||[];count+=items.length;bytes+=new Blob([JSON.stringify(items)]).size;attachmentBytes+=estimateFileRefBytes(items)});if(document.getElementById('syncScopeSettings')?.checked)bytes+=new Blob([JSON.stringify(state.settings||{})]).size;if(includeAttachments)bytes+=attachmentBytes;const el=document.getElementById('syncScopeSummary');if(el)el.textContent=`已选择 ${ids.length} 个模块，${count} 条，${formatSyncBytes(bytes)}`}

function resetSyncAuthorization(){syncOfferedScope=null;syncFrozenManifest=null;syncOfferedIdentityIds=new Set()}
function setupSyncPc(){const session=++syncSessionId;clearSyncConnectTimeout();clearSyncConnectHelp();syncPc&&syncPc.close();syncDc=null;syncIncoming=null;resetSyncAuthorization();syncPc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.cloudflare.com:3478']}]});syncPc.oniceconnectionstatechange=()=>{if(session!==syncSessionId)return;const state=syncPc.iceConnectionState;if(state==='failed')handleSyncConnectFailure('连接失败：请确认两台设备在同一网络，并关闭系统代理或 VPN 后重试');else if(state==='disconnected')syncStatus('连接中断，正在尝试恢复...');else if(state==='connected'||state==='completed'){clearSyncConnectTimeout();clearSyncConnectHelp();syncStatus('已连接')}else syncStatus('连接状态：'+state)};syncPc.ondatachannel=e=>setupSyncChannel(e.channel,session);return syncPc}
function setupSyncChannel(ch,session=syncSessionId){if(session!==syncSessionId)return;syncDc=ch;syncDc.binaryType='arraybuffer';syncDc.onopen=()=>{if(session!==syncSessionId||syncDc!==ch)return;clearSyncConnectTimeout();clearSyncConnectHelp();syncOfferedScope=cloneState(syncScope());syncStatus('已连接，可以发送备份');if(syncShort&&syncShort.ws){try{syncShort.ws.close()}catch(e){}syncShort.ws=null}setTimeout(()=>{if(session===syncSessionId&&syncDc===ch&&syncDc.readyState==='open')sendSyncV2({protocol:SYNC_PROTOCOL,type:'scope-offer',scope:syncOfferedScope},{channel:ch,session})},500)};syncDc.onmessage=e=>{if(session===syncSessionId&&syncDc===ch)receiveSyncMessage(e.data)};syncDc.onclose=()=>{if(session===syncSessionId&&syncDc===ch)resetSyncAuthorization()};syncDc.onerror=()=>{if(session===syncSessionId&&syncDc===ch)syncStatus('连接出错')}}
async function waitIce(pc,ms=4000){if(pc.iceGatheringState==='complete')return;const started=Date.now();await new Promise(resolve=>{const timer=setInterval(tick,1000);function tick(){if(pc.iceGatheringState==='complete'||Date.now()-started>=ms){clearInterval(timer);pc.removeEventListener('icegatheringstatechange',tick);resolve()}else syncStatus('正在收集网络候选...'+Math.floor((Date.now()-started)/1000)+'s')}pc.addEventListener('icegatheringstatechange',tick);tick()})}

function encodeDesc(desc){const text=JSON.stringify(desc);return 'ph1.'+(window.LZString?LZString.compressToEncodedURIComponent(text):btoa(text))}

async function syncCreateOffer(){try{syncRole='offerer';syncStatus('正在创建发送码...');const pc=setupSyncPc();setupSyncChannel(pc.createDataChannel('backup'));await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);const code=encodeDesc(pc.localDescription);document.getElementById('syncLocal').value=code;renderSyncQr(code);syncStatus('发送码已生成，复制或扫码给另一台设备')}catch(e){syncStatus('创建发送码失败：'+e.message)}}

function shortRelayUrl(){try{return new URL(new URLSearchParams(location.search).get('relay')||'https://personal-hub-shortcode-relay.zal-pc-remote.workers.dev').toString().replace(/\/+$/,'')}catch(e){return ''}}
function shortRelayName(){try{return new URL(shortRelayUrl()).hostname}catch(e){return '未配置'}}
async function shortRelayRequest(path,options={}){const relay=shortRelayUrl();if(!relay)throw new Error('短码中继还没有部署，请在页面中配置/APIURL或用GitHub Actions配置');const response=await fetch(relay+path,Object.assign({headers:{'content-type':'application/json'}},options));let data=null;try{data=await response.json()}catch(e){}if(!response.ok){throw new Error((data&&data.error)||('中继返回 '+response.status))}return data||{}}
function shortCodeId(){return 'sc-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
async function syncShortCreate(){
  if(!navigator.onLine){toast('当前离线，短码联动需要联网中继');return}
  stopShortRelay();
  const clientId=shortCodeId();
  try{
    syncStatus('正在创建短码房间...');
    const created=await shortRelayRequest('/api/room',{method:'POST',body:JSON.stringify({clientId})});
    syncShort={role:'creator',clientId,token:created.token,code:created.code,peer:0,since:0,seen:new Set(),poller:null,stopped:false,offerSent:false,pendingIce:[]};
    const display=document.getElementById('shortCodeDisplay');
    if(display)display.textContent=created.code;
    const relayName=document.getElementById('shortRelayName');
    if(relayName)relayName.textContent=shortRelayName();
    const stateEl=document.getElementById('shortRelayState');
    if(stateEl)stateEl.textContent='已创建，有效期约 5 分钟';
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(created.code).catch(()=>{})}
    syncStatus('等待另一台设备加入'+created.code+'...');
    armShortRelayTimeout('等待对方加入超时：45 秒内没有设备加入，请重新创建。',45);
    await startShortRelayPc();
    startShortRelayWs();
  }catch(error){
    syncShort=null;syncStatus('创建短码失败：'+error.message);toast('创建短码失败：'+error.message);
  }
}
async function syncShortJoin(){
  if(!navigator.onLine){toast('当前离线，短码联动需要联网中继');return}
  const input=document.getElementById('shortJoinCode');
  const code=(input?input.value:'').trim();
  if(!/^[0-9]{6}$/.test(code)){toast('请输入 6 位数字短码');return}
  stopShortRelay();
  const clientId=shortCodeId();
  try{
    syncStatus('正在加入短码房间...');
    const joined=await shortRelayRequest('/api/room/'+code+'/join',{method:'POST',body:JSON.stringify({clientId})});
    syncShort={role:'joiner',clientId,token:joined.token,code,peer:1,since:0,seen:new Set(),poller:null,stopped:false,offerSent:false,pendingIce:[]};

    armShortRelayTimeout('短码连接超时：45 秒内未建立连接，请确认两台设备可直连并重试。',45);
    await startShortRelayPc();
    startShortRelayWs();
  }catch(error){
    syncShort=null;syncStatus('加入失败：'+error.message);toast('加入失败：'+error.message);
  }
}
async function startShortRelayPc(){
  if(!syncShort||syncShort.stopped)return;
  syncRole=syncShort.role==='creator'?'short-creator':'short-joiner';
  const pc=setupSyncPc();
  pc.onicecandidate=e=>{if(!syncShort||syncShort.stopped)return;if(!e.candidate)return;if(!syncShort.offerSent){syncShort.pendingIce.push(e.candidate);return}shortRelaySend('ice',JSON.stringify(e.candidate),pc)};
  if(syncShort.role==='joiner'){
    setupSyncChannel(pc.createDataChannel('backup'));
    await pc.setLocalDescription(await pc.createOffer());
    if(!syncShort||syncShort.stopped)return;
    await shortRelaySend('offer',JSON.stringify(pc.localDescription),pc);
    syncShort.offerSent=true;
    const pending=syncShort.pendingIce.splice(0);
    for(const candidate of pending){if(syncShort&&!syncShort.stopped)await shortRelaySend('ice',JSON.stringify(candidate),pc)}
  }
}
async function shortRelaySend(action,payload,pc){
  if(!syncShort||syncShort.stopped)return false;
  const msg={action,payload,msgId:shortCodeId()};
  const ws=syncShort.ws;
  if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(msg));return true}catch(error){}}
  const result=await shortRelayRequest('/api/room/'+syncShort.code+'/send',{method:'POST',headers:{'x-relay-token':syncShort.token,'x-client-id':syncShort.clientId},body:JSON.stringify({message:msg})});
  return !!(result&&result.relayed);
}
async function handleShortRelayEvents(events){
  if(!syncShort||syncShort.stopped)return;
  for(const event of(events||[])){
    if(!syncShort||syncShort.stopped)return;
    if(syncShort.seen.has(event.seq))continue;
    syncShort.seen.add(event.seq);
    if(event.action==='offer'&&syncShort.role==='creator')await handleShortOffer(event.payload);
    else if(event.action==='answer'&&syncShort.role==='joiner')await handleShortAnswer(event.payload);
    else if(event.action==='ice')await handleShortIce(event.payload);
  }
}
function startShortRelayWs(){
  if(!syncShort||syncShort.stopped||typeof WebSocket==='undefined'){startShortRelayPolling();return}
